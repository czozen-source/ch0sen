<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Wojownicy Ulicy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one arcade screen (384x224, pixel-scaled) centred; on touch devices a pad + 6 buttons sit below (portrait) or over the corners (landscape) */
:root {
  --bg: #07060d;
  --cab: #14111f;
  --fg: #f4ecd8;
  --gold: #ffcc1a;
  --red: #ff3b3b;
  --blue: #3ba4ff;
  --pixel: "Press Start 2P", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  font-family: var(--pixel);
}
#screen {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  box-shadow: 0 0 0 3px var(--cab), 0 0 40px rgba(255, 204, 26, .12);
}
#touch {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#touch.overlay { opacity: .55; }
#dpad {
  pointer-events: auto;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #2a2440 0 30%, #1b1730 31% 100%);
  border: 3px solid #3a3358;
  position: relative;
  touch-action: none;
}
#dpad::before, #dpad::after {
  content: ""; position: absolute; background: #3a3358; border-radius: 4px;
}
#dpad::before { left: 50%; top: 14px; bottom: 14px; width: 34px; transform: translateX(-50%); }
#dpad::after { top: 50%; left: 14px; right: 14px; height: 34px; transform: translateY(-50%); }
#knob {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: var(--red); border: 3px solid #7a1010; z-index: 2;
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.25);
}
#btns {
  pointer-events: auto;
  display: grid;
  grid-template-columns: repeat(3, 58px);
  gap: 10px;
}
#btns button, #tbar button {
  font-family: var(--pixel);
  color: var(--fg);
  border: 3px solid rgba(0,0,0,.45);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
#btns button {
  width: 58px; height: 58px; border-radius: 50%;
  font-size: 7px; letter-spacing: .5px;
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.25);
}
#btns button.on { transform: translateY(2px); filter: brightness(1.4); }
.b-p { background: #c22a2a; }
.b-k { background: #2a62c2; }
.b-s { background: #c2862a; }
.b-u { background: #6b2ac2; }
#tbar {
  position: fixed; top: calc(6px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
  display: flex; gap: 6px; pointer-events: auto;
}
#tbar button {
  background: #221d36; font-size: 8px; padding: 8px 10px; border-radius: 6px;
}
#rotate {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 8px; line-height: 1.8; color: #8a7aa8; padding-inline: 16px;
}
#tbar button:focus-visible, #btns button:focus-visible { outline: 2px solid var(--gold); }
</style>
</head>
<body style="margin:0">

<canvas id="screen" width="384" height="224" aria-label="Wojownicy Ulicy — gra"></canvas>

<div id="touch" hidden>
  <div id="dpad"><div id="knob"></div></div>
  <div id="btns">
    <button type="button" class="b-p" data-b="lp">CIOS</button>
    <button type="button" class="b-p" data-b="hp">CIOS+</button>
    <button type="button" class="b-s" data-b="sp">SPEC</button>
    <button type="button" class="b-k" data-b="lk">KOP</button>
    <button type="button" class="b-k" data-b="hk">KOP+</button>
    <button type="button" class="b-u" data-b="su">SUPER</button>
  </div>
</div>
<p id="rotate" hidden>USTAW TELEFON POZIOMO,<br>BĘDZIE WIĘKSZY EKRAN</p>
<div id="tbar" hidden>
  <button type="button" id="bMute">AUDIO</button>
  <button type="button" data-b="start">START</button>
</div>

<script>
'use strict';
// ================================================================
//  WOJOWNICY ULICY - Turbo Edycja '94
// ================================================================
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const W = 384, H = 224, GROUND = 204, STAGE_W = 576, GRAV = 0.5;
const R = Math.PI / 180;
const FONT = '"Press Start 2P", "Courier New", monospace';

// ---------------- utils ----------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function prng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1, 7).replace(/\./g, '0');
}
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function overlap(a, b) { return a && b && a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
// Press Start 2P has no capital Ó Ś Ć Ź Ń Ż: draw the base letter and add the mark by hand
const ACC = { 'Ó': 'O', 'Ś': 'S', 'Ć': 'C', 'Ź': 'Z', 'Ń': 'N', 'Ż': 'Z' };
const ACC_RE = /[ÓŚĆŹŃŻ]/g;
function accents(s, x, top, size, align, col) {
  if (!ACC_RE.test(s)) return; ACC_RE.lastIndex = 0;
  const plain = s.replace(ACC_RE, c => ACC[c]);
  const full = ctx.measureText(plain).width;
  const x0 = align === 'center' ? x - full / 2 : align === 'right' ? x - full : x;
  const u = Math.max(1, Math.round(size / 8));
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const c = s[i]; if (!ACC[c]) continue;
    const cx = Math.round(x0 + ctx.measureText(plain.slice(0, i)).width + size * 0.44);
    const ty = Math.round(top - 2.2 * u);
    if (c === 'Ż') ctx.fillRect(cx - u, ty, 2 * u, 2 * u);
    else { ctx.fillRect(cx, ty, 2 * u, u); ctx.fillRect(cx - u, ty + u, 2 * u, u); }
  }
}
function txt(s, x, y, size = 8, col = '#fff', align = 'left', sh = '#000') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  const plain = s.replace(ACC_RE, c => ACC[c]);
  if (sh) { ctx.fillStyle = sh; ctx.fillText(plain, Math.round(x) + 1, Math.round(y) + 1); accents(s, Math.round(x) + 1, Math.round(y) + 1, size, align, sh); }
  ctx.fillStyle = col; ctx.fillText(plain, Math.round(x), Math.round(y));
  accents(s, Math.round(x), Math.round(y), size, align, col);
}
function bigTxt(s, x, y, size, c1, c2, stroke = '#000') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size / 4); ctx.strokeStyle = stroke;
  const raw = s; s = s.replace(ACC_RE, c => ACC[c]);
  ctx.strokeText(s, x, y);
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillText(s, x, y);
  accents(raw, x, y - size / 2 - 1, size, 'center', c1);
}
function wrap(s, max) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w;
  }
  if (line.trim()) out.push(line.trim());
  return out;
}

// ---------------- audio ----------------
let AC = null, master = null, musicGain = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.13; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0, dest = master) {
  if (!AC) return;
  const t = AC.currentTime + Math.max(0, when);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.3, freq = 2000, q = 1, when = 0, dest = master) {
  if (!AC) return;
  const t = AC.currentTime + Math.max(0, when);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.03);
}
function sfx(n) {
  if (!AC || muted) return;
  switch (n) {
    case 'swing': noise(0.07, 0.12, 3200, 0.7); break;
    case 'hitL': noise(0.08, 0.45, 1500, 1); tone(170, 0.08, 'square', 0.14, 0.5); break;
    case 'hitH': noise(0.18, 0.6, 800, 0.8); tone(110, 0.2, 'square', 0.25, 0.4); break;
    case 'block': noise(0.05, 0.3, 5200, 3); tone(950, 0.05, 'square', 0.07, 0.7); break;
    case 'proj': tone(200, 0.35, 'sawtooth', 0.14, 3.5); noise(0.3, 0.14, 1200, 0.5); break;
    case 'rise': tone(180, 0.28, 'square', 0.14, 4); break;
    case 'ko': tone(320, 1.3, 'sawtooth', 0.25, 0.12); noise(0.9, 0.4, 400, 0.5); break;
    case 'blip': tone(880, 0.05, 'square', 0.1); break;
    case 'ok': tone(660, 0.08, 'square', 0.14); tone(990, 0.14, 'square', 0.14, 1, 0.08); break;
    case 'super': [0, 4, 7, 12, 16].forEach((s, i) => tone(262 * Math.pow(2, s / 12), 0.35, 'square', 0.13, 1, i * 0.05)); noise(0.5, 0.2, 3000, 0.4); break;
    case 'land': noise(0.06, 0.18, 300, 1); break;
    case 'throw': noise(0.25, 0.5, 500, 0.7); tone(90, 0.3, 'square', 0.25, 0.5); break;
    case 'jump': tone(300, 0.08, 'square', 0.06, 1.6); break;
  }
}
function say(text) {
  if (muted) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pl-PL'; u.rate = 1.05; u.pitch = 0.55; u.volume = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* no speech on this device */ }
}
// tiny chiptune sequencer: bass + lead + drums, 16 steps x 4 bars
const SONGS = [
  { root: 110, tempo: 0.125, prog: [0, -4, -2, 0],
    bass: [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 10, 7],
    lead: [12, null, null, 15, null, 17, null, 15, 12, null, 10, null, 7, null, 10, null] },
  { root: 98, tempo: 0.115, prog: [0, 3, 5, 3],
    bass: [0, 12, 0, 12, 0, 12, 0, 12, 3, 15, 3, 15, 5, 17, 7, 19],
    lead: [19, 17, 15, null, 12, null, 15, 17, 19, null, 22, null, 19, 17, 15, 12] },
  { root: 123.5, tempo: 0.13, prog: [0, 5, 3, -2],
    bass: [0, null, 0, 7, 12, null, 0, 7, 0, null, 0, 7, 12, 10, 7, 3],
    lead: [7, null, 10, null, 12, null, null, 10, 15, null, 12, null, 10, 7, null, null] },
];
const music = { on: false, song: SONGS[0], step: 0, next: 0 };
function musicStart(i) {
  music.song = SONGS[i % SONGS.length]; music.step = 0; music.on = true;
  if (AC) music.next = AC.currentTime + 0.1;
}
function musicStop() { music.on = false; }
function musicTick() {
  if (!AC || !music.on || muted) { if (AC) music.next = AC.currentTime + 0.1; return; }
  const s = music.song;
  if (music.next < AC.currentTime) music.next = AC.currentTime + 0.02;
  while (music.next < AC.currentTime + 0.12) {
    const i = music.step % 16, bar = Math.floor(music.step / 16) % 4, tr = s.prog[bar];
    const when = music.next - AC.currentTime;
    const b = s.bass[i];
    if (b != null) tone(s.root * Math.pow(2, (b + tr) / 12), s.tempo * 0.9, 'triangle', 0.55, 0, when, musicGain);
    const l = s.lead[i];
    if (l != null && bar % 2 === 1) tone(s.root * 2 * Math.pow(2, (l + tr) / 12), s.tempo * 1.6, 'square', 0.18, 0, when, musicGain);
    if (i % 4 === 0) tone(130, 0.12, 'sine', 0.7, 0.3, when, musicGain);
    if (i % 8 === 4) noise(0.12, 0.35, 1800, 0.6, when, musicGain);
    if (i % 2 === 1) noise(0.03, 0.12, 8000, 1, when, musicGain);
    music.next += s.tempo; music.step++;
  }
}

// ---------------- input ----------------
const BTN = ['up', 'down', 'left', 'right', 'lp', 'hp', 'lk', 'hk', 'sp', 'su', 'start'];
const KEYS = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], lp: ['KeyF'], hp: ['KeyG'], lk: ['KeyV'], hk: ['KeyB'], sp: ['KeyE'], su: ['KeyR'], start: ['Enter', 'Space'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], lp: ['KeyI'], hp: ['KeyO'], lk: ['KeyK'], hk: ['KeyL'], sp: ['KeyP'], su: ['Semicolon'], start: ['NumpadEnter'] },
];
const kb = {};
const touch = {};
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  kb[e.code] = true; initAudio();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
  if (e.code === 'Escape' && !e.repeat) togglePause();
});
addEventListener('keyup', e => { kb[e.code] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; for (const k in touch) touch[k] = false; });
addEventListener('pointerdown', initAudio);

function readPad(map) { const o = {}; for (const b of BTN) o[b] = map[b].some(c => kb[c]); return o; }
function readGamepad(gp, o) {
  if (!gp) return;
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  o.left = o.left || b(14) || ax < -0.5; o.right = o.right || b(15) || ax > 0.5;
  o.up = o.up || b(12) || ay < -0.5; o.down = o.down || b(13) || ay > 0.5;
  o.lp = o.lp || b(2); o.hp = o.hp || b(3); o.lk = o.lk || b(0); o.hk = o.hk || b(1);
  o.sp = o.sp || b(4) || b(6); o.su = o.su || b(5) || b(7); o.start = o.start || b(9);
}
function readInputs() {
  const a = readPad(KEYS[0]), b = readPad(KEYS[1]);
  for (const k of BTN) a[k] = a[k] || !!touch[k];
  let gps = [];
  try { gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) { gps = []; }
  readGamepad(gps[0], a); readGamepad(gps[1], b);
  if (G.mode !== '2p') for (const k of BTN) a[k] = a[k] || b[k];
  return [a, b];
}

// ---------------- combat ----------------
function addMeter(f, v) { f.meter = Math.min(100, f.meter + v); }

    G.rstate = 'ko'; G.rt = 0; G.slow = 70; G.flash = 8; sfx('ko'); say('K.O.!');

}

    if (def.air) return false;

    def.face = -att.face;

    knockdown(def, att.face, 3.6, -7);

    G.hitstop = 5; sfx('block');

function spawnProj(f, p) {

// ---------------- AI ----------------
function aiInput(me, opp) {
  const inp = {};
  if (G.rstate !== 'fight') return inp;
  const A = me.ai || (me.ai = { plan: 'wait', pt: 20, step: 0, projSeen: -1, jumpSeen: -1, atkSeen: -1, delay: 0 });
  const lv = G.diff;
  const dx = opp.x - me.x, dist = Math.abs(dx);
  const toward = dx > 0 ? 'right' : 'left', away = dx > 0 ? 'left' : 'right';
  const reach = 40 * me.s;

  // reactions
  const pr = G.proj.find(p => p.owner === opp && Math.sign(p.vx) === Math.sign(me.x - p.x) && Math.abs(p.x - me.x) < 120);
  if (pr && A.projSeen !== pr.id) {
    A.projSeen = pr.id; const r = Math.random();
    if (r < [0.35, 0.45, 0.45][lv]) { A.plan = 'block'; A.pt = 40; }
    else if (r < [0.5, 0.8, 0.95][lv]) { A.plan = me.ch.proj && !me.hasProj() && Math.random() < 0.5 ? 'proj' : 'jumpin'; A.pt = 2; A.step = 0; }
  }
  if (opp.air && opp.state !== 'fall' && A.jumpSeen !== opp.jumpId && dist < 120 && Math.sign(opp.vx) === Math.sign(me.x - opp.x)) {
    A.jumpSeen = opp.jumpId;
    if (Math.random() < [0.15, 0.45, 0.8][lv]) { A.plan = 'anti'; A.pt = 30; A.delay = Math.max(0, Math.floor((dist - 36) / 3.2)); }
    else if (Math.random() < 0.5) { A.plan = 'block'; A.pt = 30; }
  }
  if (opp.state === 'attack' && opp.move && opp.move.type !== 'proj' && A.atkSeen !== opp.atkId && dist < 90 && opp.mt < (opp.move.st || 0) + 1) {
    A.atkSeen = opp.atkId;

  }

  if (A.pt <= 0) {
    const r = Math.random();

    if (me.meter >= 100 && dist < 150 && Math.random() < [0.2, 0.4, 0.6][lv]) A.plan = 'super';
    else if (dist > 150) A.plan = me.ch.proj && !me.hasProj() && r < 0.35 ? 'proj' : r < 0.85 ? 'walk' : 'jumpin';
    else if (dist > reach + 18) A.plan = r < 0.4 * agg + 0.2 ? 'walk' : r < 0.55 ? (me.ch.proj && !me.hasProj() ? 'proj' : 'walk') : r < 0.68 ? 'jumpin' : r < 0.78 ? 'rush' : r < 0.88 ? 'back' : 'wait';
    else {
      if (r < 0.18) A.plan = 'poke';
      else if (r < 0.3) A.plan = 'low';
      else if (r < 0.42) A.plan = 'heavy';
      else if (r < 0.52) A.plan = 'sweep';
      else if (r < 0.52 + 0.14 * lv) A.plan = 'combo';
      else if (r < 0.74) A.plan = dist < 34 ? 'throw' : 'poke';
      else if (r < 0.84) A.plan = 'block';
      else if (r < 0.92) A.plan = me.ch.grab ? 'proj' : 'back';
      else A.plan = 'jumpback';
    }
    A.step = 0;
    A.pt = { walk: 12 + rnd(0, 26), back: 10 + rnd(0, 16), block: 18 + rnd(0, 20), wait: [26, 16, 8][lv] + rnd(0, 16) }[A.plan] || 24;
    A.pt = Math.floor(A.pt);

    case 'walk': inp[toward] = true; if (dist < reach) A.pt = 0; break;
    case 'back': inp[away] = true; break;
    case 'block': inp[away] = true; break;
    case 'cblock': inp[away] = true; inp.down = true; break;
    case 'poke': press(Math.random() < 0.5 ? 'lp' : 'lk'); A.step++; break;
    case 'low': inp.down = true; press('lk'); A.step++; break;
    case 'heavy': press(Math.random() < 0.5 ? 'hp' : 'hk'); A.step++; break;
    case 'sweep': inp.down = true; press('hk'); A.step++; break;
    case 'throw': inp[toward] = true; press('hp'); A.step++; break;
    case 'proj': if (me.ch.grab && dist > 50) { inp[toward] = true; break; } press('sp'); A.step++; break;
    case 'rush': inp[away] = true; press('sp'); A.step++; break;
    case 'super': press('su'); A.step++; break;
    case 'jumpin':
      if (A.step === 0) { inp.up = true; inp[toward] = true; }
      A.step++;
      if (me.air && !me.usedAir && me.vy > 0 && dist < 60) inp[Math.random() < 0.5 ? 'hk' : 'hp'] = true;

    case 'anti':

      if (A.step === 0) { if (lv === 0 || Math.random() < 0.3) { inp.down = true; inp.hp = true; } else { inp.up = true; inp.sp = true; } }

      else if (me.connected && A.step < 12) { inp.sp = true; inp.up = Math.random() < 0.4; A.pt = 0; }
      A.step++;
      break;
  }

  return inp;
}

// ---------------- fight flow ----------------
function newMatch(c1, c2, stage) {
  G.p = [new Fighter(CHARS[c1], 0, true), new Fighter(CHARS[c2], 1, G.mode === '2p')];
  G.stage = stage; G.wins = [0, 0]; G.round = 1;
  startRound();
  setScene('fight');
  musicStart(stage);
}
function startRound() {
  for (const f of G.p) { const m = f.meter; f.reset(); f.meter = m; }
  G.proj = []; G.fx = []; G.timer = 99; G.tf = 0; G.rstate = 'intro'; G.rt = 0; G.slow = 0; G.freeze = 0; G.hitstop = 0;
  G.winner = -1; G.perfect = false; G.camX = (STAGE_W - W) / 2;
  G.banner = G.wins[0] === 1 && G.wins[1] === 1 ? 'RUNDA FINAŁOWA' : 'RUNDA ' + G.round;
}
function fightStep() {
  if (G.paused) return;
  const [a, b] = G.p;
  G.rt++;
  if (G.flash > 0) G.flash--;

    if (G.rt === 2) say(G.banner === 'RUNDA FINAŁOWA' ? 'Runda finałowa!' : 'Runda ' + ['pierwsza', 'druga', 'trzecia', 'czwarta', 'piąta'][Math.min(4, G.round - 1)] + '!');
    if (G.rt === 72) { say('Walcz!'); sfx('ok'); }
    if (G.rt >= 108) { G.rstate = 'fight'; G.rt = 0; }
  }
  if (G.freeze > 0) {
    G.freeze--;
    if (G.freeze % 3 === 0) G.fx.push({ type: 'spark', x: G.superBy.x + rnd(-30, 30), y: G.superBy.y - rnd(10, 100), vx: 0, vy: -1.2, life: 18, max: 18, col: G.superBy.ch.col.accent, size: 2 });
    updateFx(); return;
  }
  if (G.hitstop > 0) { G.hitstop--; return; }
  if (G.slow > 0) { G.slow--; if (G.slow % 3 !== 0) return; }

  // inputs
  const ins = [a.human ? G.in[0] : aiInput(a, b), b.human ? G.in[1] : aiInput(b, a)];
  const ctrl = G.rstate === 'fight';
  for (let i = 0; i < 2; i++) {
    const f = G.p[i], o = G.p[1 - i];
    if (ctrl) f.input(ins[i], o);
    else {
      f.prevInp = { ...ins[i] };
      if (f.neutral && f.state !== 'idle') { f.set('idle'); f.vx = 0; }
      if (f.neutral) f.vx = 0;
    }
  }
  a.update(b); b.update(a);

  // hit detection (simultaneous)
  const hits = [];
  for (let i = 0; i < 2; i++) {
    const f = G.p[i], o = G.p[1 - i];
    if (f.active()) {
      const hb = f.hitbox(), hu = o.hurt();
      if (overlap(hb, hu)) hits.push([f, o, f.move, (Math.max(hb.x, hu.x) + Math.min(hb.x + hb.w, hu.x + hu.w)) / 2, (Math.max(hb.y, hu.y) + Math.min(hb.y + hb.h, hu.y + hu.h)) / 2]);
    }

  }

  updateFx();

  // facing, push-apart, bounds
  for (let i = 0; i < 2; i++) {
    const f = G.p[i], o = G.p[1 - i];

  }
  const solid = f => f.state !== 'down' && f.state !== 'ko' && f.state !== 'fall';

    const minD = 11 * a.s + 11 * b.s;
    const ha = a.hurt(), hb2 = b.hurt();

    const d = b.x - a.x;

    f.x = clamp(f.x, 16, STAGE_W - 16);
  }

  if (G.cheer > 0) G.cheer--;
  if (G.shake > 0) G.shake--;

  // timer
  if (G.rstate === 'fight') {
    if (++G.tf >= 60) { G.tf = 0; G.timer--; }
    if (G.timer <= 0) {
      G.timer = 0; G.rstate = 'timeup'; G.rt = 0; say('Koniec czasu!');
      const ra = a.hp / a.maxHp, rb = b.hp / b.maxHp;
      G.winner = ra > rb ? 0 : rb > ra ? 1 : -1;
    }
  }
  if (G.rstate === 'ko' || G.rstate === 'timeup') roundEnd();
}
function roundEnd() {
  const [a, b] = G.p;
  if (G.rstate === 'ko' && a.hp <= 0 && b.hp <= 0) G.winner = -1;
  if (G.rt === 100) {
    if (G.winner >= 0) {
      const w = G.p[G.winner];
      G.perfect = w.hp >= w.maxHp;
      G.wins[G.winner]++;
      say(G.perfect ? 'Perfekcyjnie!' : 'Wygrywa ' + w.ch.name.toLowerCase().replace('-7', ' siedem') + '!');
    } else say('Remis!');
  }
  if (G.rt > 100 && G.winner >= 0) {
    const w = G.p[G.winner];
    if (w.neutral || w.state === 'land') { w.set('win'); w.vx = 0; }
  }
  if (G.rt === 250) {
    if (G.wins[0] >= 2 || G.wins[1] >= 2) matchEnd();

  }
}
function matchEnd() {
  const w = G.wins[0] >= 2 ? 0 : 1;
  G.matchWinner = w;
  musicStop();
  if (G.mode === '1p') {

// ---------------- scenes ----------------

  for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  G.ladder = others; G.ladderIdx = 0;

}
function currentOpp() { return G.mode === '1p' ? G.ladder[G.ladderIdx] : G.sel[1]; }

function step() {

  musicTick();
  switch (G.scene) {

    case 'select': selectStep(); break;
    case 'vs':
      if (G.sceneT === 2) say(CHARS[G.sel[0]].name.toLowerCase().replace('-7', ' siedem') + ' kontra ' + CHARS[currentOpp()].name.toLowerCase().replace('-7', ' siedem'));
      if (G.sceneT > 170 || (G.sceneT > 30 && (anyPressed('start') || anyPressed('lp')))) {
        const o = currentOpp();
        newMatch(G.sel[0], o, G.mode === '1p' ? CHARS[o].stage : (Math.random() < 0.5 ? CHARS[G.sel[0]].stage : CHARS[o].stage));
      }
      break;
    case 'fight':
      if (pressed(0, 'start') || pressed(1, 'start')) { if (G.rstate === 'fight' || G.paused) togglePause(); }
      if (G.paused && (anyPressed('sp'))) { G.paused = false; musicStop(); setScene('title'); break; }
      fightStep(); break;
    case 'result':
      if (G.sceneT > 60 && (anyPressed('start') || anyPressed('lp'))) {
        sfx('ok');
        if (G.mode === '1p') {
          G.ladderIdx++;
          if (G.ladderIdx >= G.ladder.length) { setScene('ending'); say('Gratulacje! Jesteś mistrzem!'); }
          else setScene('vs');
        } else { G.selDone = [false, false]; setScene('select'); }
      }
      break;
    case 'continue':
      G.cont--;
      if (G.sceneT > 20 && (anyPressed('start') || anyPressed('lp'))) { sfx('ok'); setScene('vs'); break; }
      if (G.sceneT > 20 && (anyPressed('lk') || anyPressed('hk'))) G.cont -= 50;
      if (G.cont % 60 === 59 && G.cont > 0) sfx('blip');
      if (G.cont <= 0) { setScene('gameover'); say('Koniec gry'); }
      break;
    case 'gameover': if (G.sceneT > 150 || (G.sceneT > 40 && anyPressed('start'))) setScene('title'); break;
    case 'ending': if (G.sceneT > 120 && (anyPressed('start') || anyPressed('lp'))) setScene('title'); break;
  }
}
const MENU = ['1 GRACZ - ARCADE', '2 GRACZY - WERSUS', 'POZIOM', 'JAK GRAĆ'];
function titleStep() {
  if (anyPressed('up')) { G.menu = (G.menu + MENU.length - 1) % MENU.length; sfx('blip'); }
  if (anyPressed('down')) { G.menu = (G.menu + 1) % MENU.length; sfx('blip'); }
  const go = anyPressed('start') || anyPressed('lp') || anyPressed('lk');
  if (G.menu === 2 && (anyPressed('left') || anyPressed('right') || go)) {
    G.diff = (G.diff + (anyPressed('left') ? 2 : 1)) % 3; sfx('blip'); return;
  }
  if (go) {
    sfx('ok');
    if (G.menu === 0) { G.mode = '1p'; G.selDone = [false, false]; setScene('select'); say('Wybierz wojownika'); }
    else if (G.menu === 1) { G.mode = '2p'; G.selDone = [false, false]; setScene('select'); say('Wybierzcie wojowników'); }
    else if (G.menu === 3) setScene('howto');
  }
}
function selectStep() {
  const n = G.mode === '2p' ? 2 : 1;
  for (let i = 0; i < n; i++) {
    if (G.selDone[i]) { if (pressed(i, 'lk') || pressed(i, 'hk')) { G.selDone[i] = false; sfx('blip'); } continue; }
    let c = G.sel[i];
    if (pressed(i, 'left')) c = c % 3 === 0 ? c + 2 : c - 1;
    if (pressed(i, 'right')) c = c % 3 === 2 ? c - 2 : c + 1;
    if (pressed(i, 'up') || pressed(i, 'down')) c = (c + 3) % 6;
    if (c !== G.sel[i]) { G.sel[i] = c; sfx('blip'); }
    if (pressed(i, 'lp') || pressed(i, 'hp') || pressed(i, 'start')) {
      G.selDone[i] = true; sfx('ok'); say(CHARS[c].name.toLowerCase().replace('-7', ' siedem'));
    }
    if (G.sceneT > 10 && (pressed(i, 'lk') || pressed(i, 'hk')) && i === 0 && !G.selDone[0]) { setScene('title'); return; }
  }
  if (G.mode === '1p' && G.selDone[0] && G.sceneT > 10) { if (!G.selT) G.selT = G.sceneT; if (G.sceneT - G.selT > 40) { G.selT = 0; startArcade(); } }
  if (G.mode === '2p' && G.selDone[0] && G.selDone[1]) { if (!G.selT) G.selT = G.sceneT; if (G.sceneT - G.selT > 40) { G.selT = 0; setScene('vs'); } }
}
function togglePause() {
  if (G.scene !== 'fight') return;
  G.paused = !G.paused; sfx('blip');
}
function toggleMute() {
  muted = !muted;
  try { if (muted) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  document.getElementById('bMute').textContent = muted ? 'CISZA' : 'AUDIO';
}

const OUT = '#120a12';
function legV(a, TH, SH) { return Math.cos(a[0] * R) * TH + Math.cos(a[1] * R) * SH; }
function getPose(f) {
  const st = f.state, t = f.t;
  switch (st) {
    case 'idle': {
      const b = Math.sin((G.frame + f.side * 20) * 0.12);
      const p = mixPose(P.idle, P.idle, 0);
      p.aF = [p.aF[0] + b * 4, p.aF[1] + b * 5]; p.aB = [p.aB[0] + b * 3, p.aB[1] + b * 4];
      p.lF = [p.lF[0] + b * 2, p.lF[1] - b * 2]; p.lB = [p.lB[0] - b * 2, p.lB[1] + b * 2];

    }
    case 'walk': {
      const ph = Math.sin(G.frame * 0.22) * (f.vx * f.face > 0 ? 1 : -1);
      const p = mixPose(P.idle, P.idle, 0);
      p.lF = [10 + ph * 20, -5 + ph * 14]; p.lB = [-10 - ph * 20, -5 - ph * 14 - 6];
      p.aF = [50 + ph * 6, 135]; p.aB = [30 - ph * 6, 145];
      return p;
    }
    case 'crouch': return mixPose(P.idle, P.crouch, t / 3);
    case 'guard': return f.inp.down ? P.cguard : P.guard;
    case 'block': return f.crouchBlock ? P.cguard : P.guard;
    case 'jump': {
      if (f.vx === 0) return P.jump;
      const p = mixPose(P.jump, P.jump, 0); p.flip = true; return p;
    }
    case 'land': return P.landing;
    case 'landrec': return P.crouch;
    case 'hit': return mixPose(P.hit, P.idle, t / Math.max(1, t + f.stun) * 0.6);
    case 'chit': return P.chit;
    case 'fall': return P.fall;
    case 'down': case 'ko': return P.down;
    case 'getup': return mixPose(P.down, P.crouch, t / 18);
    case 'win': {
      const p = mixPose(P.idle, P.win, t / 12);
      if (f.ch.id === 'jagoda') { p.lF = [130 - Math.min(t, 12) * 3, 130]; }
      return p;
    }
    case 'attack': {
      const m = f.move;
      const base = m.crouch ? P.crouch : (m.air || f.air) ? P.jump : P.idle;
      let tgt = P[m.pose] || P.jab;
      if ((m.type === 'rush' || (m.type === 'super' && m.kind === 'rush')) && m.pose === 'rushk' && f.mt >= m.st && f.mt < m.st + m.ac) {
        tgt = Math.floor(f.mt / 5) % 2 ? P.rushk2 : P.rushk;
      }
      if (m.type === 'rise' && f.mt >= m.st + m.ac) return P.jump;
      if (m.type === 'super' && G.freeze > 0) return mixPose(P.idle, P.win, 0.6);
      if (f.mt < m.st) return mixPose(base, tgt, (f.mt + 1) / m.st);
      if (f.mt < m.st + m.ac || m.air) return tgt;
      return mixPose(tgt, base, (f.mt - m.st - m.ac) / (m.rc || 1));
    }
  }
  return P.idle;
}

function drawFighter(f, cam, opts = {}) {
  const c = f.ch, s = (opts.scale || 1) * f.s, fc = f.face;
  const p = opts.pose || getPose(f);
  const TH = 21 * s, SH = 21 * s, TO = 30 * s, UA = 15 * s, FA = 15 * s, HR = 7.5 * s;
  let hipH;

  else hipH = Math.max(legV(p.lF, TH, SH), legV(p.lB, TH, SH));

  const by = (opts.y != null ? opts.y : f.y);
  const hx = bx, hy = by - hipH;
  const white = f.flashT > 0 && f.flashT % 2 === 0;
  const col = k => white ? '#ffffff' : opts.tint ? opts.tint : c.col[k];
  const dk = k => white ? '#e8e8e8' : opts.tint ? opts.tint : c.dark[k];

  // jump flip: rotate whole figure around hip
  ctx.save();

    const prog = clamp((f.t - 4) / 26, 0, 1);
    ctx.translate(hx, hy - 6 * s); ctx.rotate(prog * Math.PI * 2 * fc); ctx.translate(-hx, -(hy - 6 * s));

  const limb = (ox, oy, a, l1, l2) => {
    const kx = ox + Math.sin(a[0] * R) * l1 * fc, ky = oy + Math.cos(a[0] * R) * l1;
    return [kx, ky, kx + Math.sin(a[1] * R) * l2 * fc, ky + Math.cos(a[1] * R) * l2];
  };

    ctx.strokeStyle = OUT; ctx.lineWidth = w + 2.4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  const drawLeg = (a, back) => {
    const ox = hx + (back ? -2 : 2) * s * fc;
    const [kx, ky, ex, ey] = limb(ox, hy, a, TH, SH);
    const C = back ? dk : col;
    seg(ox, hy, kx, ky, 8.5 * s, C('pants'));
    seg(kx, ky, ex, ey, 7.5 * s, C('shin'));
    if (c.robot) ball(kx, ky, 2.6 * s, C('belt'));
    const fa = a[1] * R;
    seg(ex, ey, ex + (Math.cos(fa) * 5 * s) * fc, ey - Math.sin(fa) * 5 * s * 0.4, 5 * s, C('shoe'));
  };
  const drawArm = (a, back) => {
    const ox = sh.x + (back ? -2 : 1) * s * fc, oy = sh.y + 1.5 * s;
    const [kx, ky, ex, ey] = limb(ox, oy, a, UA, FA);
    const C = back ? dk : col;
    seg(ox, oy, kx, ky, 6.8 * s, C('sleeve'));
    seg(kx, ky, ex, ey, 6 * s, C('fore'));
    if (c.robot) ball(kx, ky, 2.2 * s, C('belt'));
    ball(ex, ey, 3.4 * s, C('glove'));

      ctx.beginPath();
      ctx.moveTo(hx - 8 * s - pad, hy - 3 * s); ctx.lineTo(hx + 8 * s + pad, hy - 3 * s);
      ctx.lineTo(hx + (14 + Math.sin(G.frame * 0.1) * 1.5) * s + pad, hy + 22 * s + pad);
      ctx.lineTo(hx - (14 - Math.sin(G.frame * 0.1) * 1.5) * s - pad, hy + 22 * s + pad); ctx.closePath(); ctx.fill();

  }

  if (c.vest) {
    const vx = Math.cos(L) * fc, vy = Math.sin(L);
    for (const k of [0.45, 0.72]) {
      const cx = lerp(hx, sh.x, k), cy = lerp(hy, sh.y, k);
      ctx.strokeStyle = white ? '#fff' : '#eaff4a'; ctx.lineWidth = 2.6 * s; ctx.lineCap = 'butt';

    ctx.beginPath(); ctx.moveTo(lerp(hx, sh.x, 0.95) - 5 * s * fc, lerp(hy, sh.y, 0.95)); ctx.lineTo(lerp(hx, sh.x, 0.55) + 6 * s * fc, lerp(hy, sh.y, 0.55)); ctx.stroke();
  }
  if (c.robot) { ball(lerp(hx, sh.x, 0.6), lerp(hy, sh.y, 0.6), 3 * s, white ? '#fff' : (G.frame % 40 < 20 ? '#ff4a2a' : '#7a1a10')); }
  // belt

function drawHead(c, x, y, r, fc, L = 0, white = false, tint = null) {

}

function drawProj(p, cam) {

    case 'fire': {

        ctx.globalAlpha = i === 3 ? 0.7 : 1;
        ctx.beginPath(); ctx.ellipse(x - d * i * 3 * sc, y, (5 + i * 3) * sc + Math.sin(t * 0.8 + i) * 1.2, (4 + i * 2.4) * sc, 0, 0, 7); ctx.fill();
      }
      break;
    }
    case 'leaf': {
      for (let i = 0; i < 7; i++) {
        const a = t * 0.35 + i * (Math.PI * 2 / 7), rr = (6 + (i % 2) * 4) * sc;
        ctx.save(); ctx.translate(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8); ctx.rotate(a * 2);
        ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(0, 0, 4.5 * sc, 2.4 * sc, 0, 0, 7); ctx.fill();
        ctx.fillStyle = i % 2 ? '#8dff6a' : '#3fbf3a'; ctx.beginPath(); ctx.ellipse(0, 0, 3.5 * sc, 1.6 * sc, 0, 0, 7); ctx.fill();
        ctx.restore();

      break;
    }
    case 'storm': {
      ctx.fillStyle = 'rgba(122,215,255,.35)'; ctx.beginPath(); ctx.arc(x, y, 12 * sc, 0, 7); ctx.fill();
      ctx.fillStyle = '#bff0ff'; ctx.beginPath(); ctx.arc(x, y, 7 * sc, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, 3.5 * sc, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e6fbff'; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        let a = rnd(0, 7), px = x, py = y; ctx.beginPath(); ctx.moveTo(px, py);
        for (let j = 0; j < 4; j++) { px += Math.cos(a) * 4 * sc; py += Math.sin(a) * 4 * sc; a += rnd(-0.9, 0.9); ctx.lineTo(px, py); }
        ctx.stroke();

    case 'rocket': {
      ctx.translate(x, y); ctx.scale(d, 1);

      ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(-18 - rnd(0, 6), 0); ctx.lineTo(-9, 3); ctx.fill();
      ctx.fillStyle = OUT; ctx.fillRect(-11, -4.5, 20, 9);
      ctx.fillStyle = '#c9d3dc'; ctx.fillRect(-10, -3.5, 16, 7);
      ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.moveTo(6, -3.5); ctx.lineTo(12, 0); ctx.lineTo(6, 3.5); ctx.fill();
      ctx.fillStyle = '#5b6773'; ctx.fillRect(-10, -6, 4, 12);
      break;
    }
    case 'pallet': {
      ctx.translate(x, y); ctx.rotate(t * 0.25 * d);
      ctx.fillStyle = OUT; ctx.fillRect(-12, -9, 24, 18);
      ctx.fillStyle = '#c99a5a'; for (let i = 0; i < 4; i++) ctx.fillRect(-11, -8 + i * 4.3, 22, 3);
      ctx.fillStyle = '#8a6232'; ctx.fillRect(-11, -8, 3, 16); ctx.fillRect(-1.5, -8, 3, 16); ctx.fillRect(8, -8, 3, 16);
      break;
    }
    case 'laser': {
      const len = Math.min(140, p.t * 7);
      const g = ctx.createLinearGradient(0, y - 16, 0, y + 16);
      g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(0.35, '#ff4a2a'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(0.65, '#ff4a2a'); g.addColorStop(1, 'rgba(255,40,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(d > 0 ? x - len : x, y - 14 - Math.sin(t) * 2, len, 28 + Math.sin(t) * 4);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 14 + Math.sin(t * 0.7) * 2, 0, 7); ctx.fill();
      break;
    }

  }
  rect(W / 2 - 15, 6, 30, 22, '#000');
  txt(String(G.timer).padStart(2, '0'), W / 2, 9, 16, G.timer <= 10 && G.frame % 30 < 15 ? '#ff4a3a' : '#ffffff', 'center');
}

function drawFightScene() {
  const sx = G.shake > 0 ? rnd(-2, 2) : 0, sy = G.shake > 0 ? rnd(-2, 2) : 0;
  ctx.save(); ctx.translate(Math.round(sx), Math.round(sy));
  STAGES[G.stage].draw(G.camX);
  if (G.freeze > 0) { ctx.fillStyle = 'rgba(0,0,10,.65)'; ctx.fillRect(-4, -4, W + 8, H + 8); }
  // shadows
  for (const f of G.p) {
    const hgt = GROUND - f.y, w = 14 * f.s * clamp(1 - hgt / 160, 0.4, 1);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(f.x - G.camX, GROUND + 1, w, 3, 0, 0, 7); ctx.fill();
  }
  const order = [...G.p].sort((u, v) => (u.state === 'attack' ? 1 : 0) - (v.state === 'attack' ? 1 : 0));
  for (const f of order) {
    for (let i = 0; i < f.trail.length; i += 2) drawFighter(f, G.camX, { x: f.trail[i].x - G.camX, y: f.trail[i].y, alpha: 0.18 + i * 0.05, tint: f.ch.col.accent });
    if (G.freeze > 0 && G.superBy === f) {
      const r = 50 + Math.sin(G.frame * 0.5) * 6;
      const gl = ctx.createRadialGradient(f.x - G.camX, f.y - 50, 4, f.x - G.camX, f.y - 50, r);
      gl.addColorStop(0, rgba(f.ch.col.accent, 0.7)); gl.addColorStop(1, rgba(f.ch.col.accent, 0));
      ctx.fillStyle = gl; ctx.fillRect(f.x - G.camX - r, f.y - 50 - r, r * 2, r * 2);
    }
    drawFighter(f, G.camX);
  }
  for (const p of G.proj) drawProj(p, G.camX);
  drawFx(G.camX);
  ctx.restore();
  drawHUD();

  if (G.freeze > 0 && G.superBy) {
    const f = G.superBy, nm = f.ch.names.super;
    const yy = 84, slide = clamp((46 - G.freeze) * 30, 0, W);
    rect(0, yy - 2, slide, 24, rgba(f.ch.col.accent, 0.85));
    rect(0, yy, slide, 20, '#000');
    txt(nm, W / 2, yy + 6, 8, '#ffffff', 'center', null);
  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash / 10})`; ctx.fillRect(0, 0, W, H); }

  // banners
  if (G.rstate === 'intro') {
    if (G.rt < 70) bigTxt(G.banner, W / 2, 96, G.banner.length > 8 ? 16 : 24, '#ffffff', '#ffcc1a');
    else bigTxt('WALCZ!', W / 2 + (G.rt < 76 ? (76 - G.rt) * 30 : 0), 96, 32, '#fff3b0', '#ff3a1a');
  }
  if (G.rstate === 'ko' && G.rt < 100) {
    const k = G.p[0].hp <= 0 && G.p[1].hp <= 0 ? 'PODWÓJNY K.O.' : 'K.O.';
    if (G.rt % 16 < 12 || G.rt > 60) bigTxt(k, W / 2, 96, k.length > 4 ? 16 : 40, '#ffffff', '#ff2a1a');
  }
  if (G.rstate === 'timeup' && G.rt < 100) bigTxt('KONIEC CZASU', W / 2, 96, 16, '#ffffff', '#ffcc1a');
  if ((G.rstate === 'ko' || G.rstate === 'timeup') && G.rt >= 100) {
    if (G.winner >= 0) {
      const nm = G.p[G.winner].ch.name;
      bigTxt(nm + ' WYGRYWA', W / 2, 84, 16, '#ffffff', '#ffcc1a');
      if (G.perfect) bigTxt('PERFEKCYJNIE!', W / 2, 110, 16, '#bff0ff', '#3ba4ff');
    } else bigTxt('REMIS', W / 2, 96, 24, '#ffffff', '#aaaaaa');
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
    bigTxt('PAUZA', W / 2, 80, 24, '#ffffff', '#ffcc1a');
    txt('START - GRAJ DALEJ', W / 2, 112, 8, '#fff', 'center');
    txt('SPEC - WYJDŹ DO MENU', W / 2, 126, 8, '#fff', 'center');
  }
}

// ---------------- menus ----------------
function bgStripes(c1, c2) {
  rect(0, 0, W, H, c1);
  ctx.fillStyle = c2;
  for (let k = -10; k < 30; k++) { const x = k * 24 + (G.frame * 0.5) % 24; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 12, 0); ctx.lineTo(x - 40, H); ctx.lineTo(x - 52, H); ctx.fill(); }
}
function dummy(ci, face, state = 'idle', t = G.frame) {
  const f = { ch: CHARS[ci], s: CHARS[ci].scale, face, state, t, side: 0, air: false, inp: {}, flashT: 0, vx: 0, trail: [] };
  return f;
}
function drawTitle() {
  // sky + grid
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c0620'); g.addColorStop(0.6, '#3a0f3a'); g.addColorStop(1, '#ff5a2a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of pre.stars) rect(s.x, s.y * 0.8, 1, 1, s.b > 0.5 ? '#fff' : '#a8a0ff');
  ctx.fillStyle = '#ffb030'; ctx.beginPath(); ctx.arc(W / 2, 150, 46, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#0c0620'; for (let i = 0; i < 6; i++) ctx.fillRect(W / 2 - 50, 112 + i * 7 + i, 100, 2 + i * 0.6);
  rect(0, 150, W, H - 150, '#12061e');
  ctx.strokeStyle = '#ff3a9a'; ctx.lineWidth = 1;
  for (let k = -16; k <= 16; k++) { ctx.beginPath(); ctx.moveTo(W / 2 + k * 10, 150); ctx.lineTo(W / 2 + k * 60, H); ctx.stroke(); }
  for (let i = 0; i < 7; i++) { const yy = 150 + Math.pow((i + (G.frame * 0.03) % 1) / 7, 2) * 74; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
  // two silhouettes
  drawFighter(dummy(0, 1), 0, { x: 70, y: 196, scale: 1.25, tint: '#05020c' });
  drawFighter(dummy(3, -1), 0, { x: W - 70, y: 196, scale: 1.25, tint: '#05020c' });
  const wob = Math.sin(G.frame * 0.05) * 2;
  bigTxt('WOJOWNICY', W / 2, 34 + wob, 24, '#fff6c0', '#ff8a1e', '#3a0a0a');
  bigTxt('ULICY', W / 2, 62 + wob, 24, '#ffe066', '#ff2a1a', '#3a0a0a');
  txt("TURBO EDYCJA '94", W / 2, 80, 8, '#7ad7ff', 'center');
  const items = MENU.map((m, i) => i === 2 ? 'POZIOM: ' + DIFFS[G.diff] : m);
  for (let i = 0; i < items.length; i++) {
    const sel = G.menu === i, yy = 104 + i * 14;
    if (sel) { rect(W / 2 - 92, yy - 3, 184, 13, 'rgba(0,0,0,.55)'); ctx.fillStyle = '#ffcc1a'; ctx.beginPath(); ctx.moveTo(W / 2 - 86, yy); ctx.lineTo(W / 2 - 80, yy + 3.5); ctx.lineTo(W / 2 - 86, yy + 7); ctx.fill(); }
    txt(items[i], W / 2, yy, 8, sel ? '#ffcc1a' : '#e8dcff', 'center');
  }
  if (G.frame % 60 < 40) txt('NACIŚNIJ START', W / 2, 168, 8, '#ffffff', 'center');
  txt('© 1994 CH0SEN ARCADE   KREDYTY: 99', W / 2, 212, 8, '#8a7aa8', 'center');
}
function drawHowto() {
  bgStripes('#0d0b1c', '#141130');
  txt('JAK GRAĆ', W / 2, 8, 16, '#ffcc1a', 'center');
  const L = [
    ['KLAWIATURA', '#7ad7ff'],
    ['GRACZ 1: WASD  CIOS F/G  KOP V/B', '#fff'],
    ['         SPEC E  SUPER R', '#fff'],
    ['GRACZ 2: STRZAŁKI  CIOS I/O  KOP K/L', '#fff'],
    ['         SPEC P  SUPER ;', '#fff'],
    ['ENTER = START/PAUZA   M = DŹWIĘK', '#fff'],
    ['', '#fff'],
    ['RUCHY (PRZODEM DO RYWALA)', '#7ad7ff'],
    ['SPEC         = POCISK (BORYS: CHWYT)', '#fff'],
    ['SPEC + GÓRA  = CIOS W GÓRĘ (NA SKOKI)', '#fff'],
    ['SPEC + TYŁ   = SZARŻA', '#fff'],

  ];
  L.forEach(([s, c], i) => txt(s, 16, 30 + i * 10, 8, c));

}
function drawSelect() {
  bgStripes('#0d0b1c', '#16123a');
  txt('WYBIERZ WOJOWNIKA', W / 2, 8, 8, '#ffcc1a', 'center');
  const tw = 40, th = 40, gx = W / 2 - (tw * 3 + 8) / 2, gy = 124;
  for (let i = 0; i < 6; i++) {
    const cx = gx + (i % 3) * (tw + 4), cy = gy + Math.floor(i / 3) * (th + 4);
    const c = CHARS[i];
    const bg = ctx.createLinearGradient(0, cy, 0, cy + th); bg.addColorStop(0, shade(c.col.accent, -0.3)); bg.addColorStop(1, shade(c.col.accent, -0.75));
    ctx.fillStyle = '#000'; ctx.fillRect(cx - 1, cy - 1, tw + 2, th + 2);
    ctx.fillStyle = bg; ctx.fillRect(cx, cy, tw, th);
    ctx.save(); ctx.beginPath(); ctx.rect(cx, cy, tw, th); ctx.clip();
    drawHead(c, cx + tw / 2, cy + th / 2 + 2, 13, 1);
    ctx.restore();
  }
  const n = G.mode === '2p' ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const s = G.sel[i], cx = gx + (s % 3) * (tw + 4), cy = gy + Math.floor(s / 3) * (th + 4);
    const on = G.selDone[i] || G.frame % 20 < 14;
    if (on) {
      ctx.strokeStyle = i === 0 ? '#ff3b3b' : '#3ba4ff'; ctx.lineWidth = 2;
      const o = i === 1 && G.sel[0] === G.sel[1] ? 3 : 0;
      ctx.strokeRect(cx - 1 + o, cy - 1 + o, tw + 2 - o * 2, th + 2 - o * 2);
      txt(i === 0 ? '1P' : '2P', cx + (i === 0 ? 2 : tw - 2), cy + th - 9 - o, 8, i === 0 ? '#ff3b3b' : '#3ba4ff', i === 0 ? 'left' : 'right');
    }
  }
  // previews
  const show = [[0, G.sel[0]], [1, G.mode === '2p' ? G.sel[1] : -1]];
  for (const [i, ci] of show) {
    const px = i === 0 ? 62 : W - 62;
    if (ci < 0) {
      txt('CPU', px, 70, 16, '#3a3460', 'center');
      txt('CZEKA...', px, 92, 8, '#3a3460', 'center');
      continue;
    }
    const c = CHARS[ci];
    const f = dummy(ci, i === 0 ? 1 : -1, G.selDone[i] ? 'win' : 'idle', G.selDone[i] ? 30 : G.frame);
    drawFighter(f, 0, { x: px, y: 112, scale: 0.95 });
    txt(c.name, px, 24, 8, i === 0 ? '#ff7a7a' : '#7ac0ff', 'center');
    txt(c.title, px, 34, 8, '#fff', 'center');
  }
  // stat card for the highlighted one(s)
  const ci = G.sel[0], c = CHARS[ci];
  const sx = W / 2 - 66, sy = 28;
  rect(sx, sy, 132, 90, 'rgba(0,0,0,.55)');
  txt(c.from, W / 2, sy + 5, 8, '#c8c0e8', 'center');
  ['MOC', 'SZYBK.', 'WYTRZ.'].forEach((lab, k) => {
    txt(lab, sx + 6, sy + 20 + k * 11, 8, '#fff');
    for (let q = 0; q < 5; q++) rect(sx + 66 + q * 12, sy + 20 + k * 11, 10, 7, q < c.stats[k] ? '#ffcc1a' : '#3a3460');
  });
  c.moves.forEach((mv, k) => txt(mv, W / 2, sy + 56 + k * 10, 8, k === 0 ? '#ff9a6a' : k === 1 ? '#9affb0' : '#9ad4ff', 'center'));
  const hint = G.mode === '2p' ? 'CIOS - WYBÓR   KOP - COFNIJ' : 'CIOS - WYBÓR   KOP - MENU';
  txt(hint, W / 2, 214, 8, '#8a7aa8', 'center');
}
function drawVs() {
  const t = G.sceneT, o = currentOpp();
  rect(0, 0, W, H, '#000');
  const k = clamp(t / 18, 0, 1);
  ctx.fillStyle = '#7a1010'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo((W / 2 + 30) * k, 0); ctx.lineTo((W / 2 - 30) * k, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#10307a'; ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W - (W / 2 - 30) * k, 0); ctx.lineTo(W - (W / 2 + 30) * k, H); ctx.lineTo(W, H); ctx.fill();
  drawFighter(dummy(G.sel[0], 1), 0, { x: 90 - (1 - k) * 120, y: 190, scale: 1.45 });
  drawFighter(dummy(o, -1), 0, { x: W - 90 + (1 - k) * 120, y: 190, scale: 1.45 });
  txt(CHARS[G.sel[0]].name, 16, 14, 16, '#fff');
  txt(CHARS[o].name, W - 16, 14, 16, '#fff', 'right');
  if (t > 20) bigTxt('VS', W / 2, 100, 40 + Math.max(0, 30 - t) * 2, '#fff6c0', '#ff8a1e');
  if (G.mode === '1p') txt('WALKA ' + (G.ladderIdx + 1) + ' / ' + G.ladder.length, W / 2, 140, 8, '#ffcc1a', 'center');
  const stg = G.mode === '1p' ? STAGES[CHARS[o].stage].name : '';
  if (stg) txt(stg, W / 2, 210, 8, '#c8c0e8', 'center');
}
function drawResult() {
  const w = G.p[G.matchWinner], l = G.p[1 - G.matchWinner];
  bgStripes('#0d0b1c', '#1c1640');
  drawFighter(dummy(CHARS.indexOf(w.ch), 1, 'win', 40), 0, { x: 80, y: 196, scale: 1.4 });
  drawFighter(dummy(CHARS.indexOf(l.ch), -1, 'down', 0), 0, { x: 300, y: 196, scale: 1.1, pose: P.down });
  txt(w.ch.name + ' WYGRYWA!', W / 2 + 40, 26, 8, '#ffcc1a', 'center');
  rect(150, 44, 222, 70, 'rgba(0,0,0,.6)');
  wrap('"' + w.ch.quote + '"', 26).forEach((ln, i) => txt(ln, 160, 52 + i * 12, 8, '#fff'));
  if (G.mode === '2p') txt('GRACZ ' + (G.matchWinner + 1) + ' TRIUMFUJE', W / 2 + 40, 124, 8, G.matchWinner === 0 ? '#ff7a7a' : '#7ac0ff', 'center');
  if (G.sceneT > 60 && G.frame % 60 < 40) txt('START - DALEJ', W / 2, 212, 8, '#ffcc1a', 'center');
}
function drawContinue() {
  rect(0, 0, W, H, '#05030c');
  drawFighter(dummy(G.sel[0], 1, 'hit', 0), 0, { x: W / 2, y: 180, scale: 1.2, pose: P.chit });
  bigTxt('GRASZ DALEJ?', W / 2, 40, 16, '#ffffff', '#ffcc1a');
  bigTxt(String(Math.max(0, Math.ceil(G.cont / 60) - 1)), W / 2, 84, 40, '#ffffff', '#ff3a1a');
  txt('START - TAK    KOP - SZYBCIEJ', W / 2, 212, 8, '#c8c0e8', 'center');
}
function drawGameOver() {
  rect(0, 0, W, H, '#000');
  bigTxt('KONIEC GRY', W / 2, H / 2 - 8, 24, '#ffffff', '#ff2a1a');
  txt('WRZUĆ MONETĘ, BY ZAGRAĆ ZNOWU', W / 2, H / 2 + 24, 8, '#8a7aa8', 'center');
}
function drawEnding() {
  const c = CHARS[G.sel[0]];
  const t = G.sceneT;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c0620'); g.addColorStop(1, shade(c.col.accent, -0.5));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 30; i++) { const x = (i * 53 + t * 0.6 * (1 + i % 3)) % W, y = (i * 37 + t * (0.5 + i % 4 * 0.3)) % H; rect(x, y, 2, 2, ['#ffcc1a', '#ff3b3b', '#3ba4ff', '#8dff6a'][i % 4]); }
  drawFighter(dummy(G.sel[0], 1, 'win', 40), 0, { x: 76, y: 200, scale: 1.5 });
  bigTxt('MISTRZ!', W / 2 + 50, 30, 24, '#fff6c0', '#ffcc1a');
  txt(c.name + ' - NAJLEPSZY WOJOWNIK ULICY', W / 2 + 50, 52, 8, '#fff', 'center');
  rect(150, 66, 222, 90, 'rgba(0,0,0,.55)');
  wrap(c.ending, 26).forEach((ln, i) => txt(ln, 160, 74 + i * 12, 8, '#fff'));
  txt('POZIOM: ' + DIFFS[G.diff], W / 2 + 50, 166, 8, '#7ad7ff', 'center');
  if (t > 120 && G.frame % 60 < 40) txt('DZIĘKUJEMY ZA GRĘ!  START', W / 2 + 50, 210, 8, '#ffcc1a', 'center');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  switch (G.scene) {
    case 'title': drawTitle(); break;
    case 'howto': drawHowto(); break;
    case 'select': drawSelect(); break;
    case 'vs': drawVs(); break;
    case 'fight': drawFightScene(); break;
    case 'result': drawResult(); break;
    case 'continue': drawContinue(); break;
    case 'gameover': drawGameOver(); break;
    case 'ending': drawEnding(); break;
  }
  // CRT scanlines
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
}

// ---------------- layout + touch ----------------
const touchUI = document.getElementById('touch');
const tbar = document.getElementById('tbar');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) { touchUI.hidden = false; }
tbar.hidden = false;
function layout() {
  const vw = innerWidth, vh = innerHeight;
  const portrait = vh > vw;
  let availH = vh, top = 0;
  if (isTouch && portrait) { availH = vh - 240; top = 40; }
  else if (!isTouch) { availH = vh - 20; top = 10; }
  const sc = Math.max(0.5, Math.min((vw - (isTouch ? 0 : 20)) / W, availH / H));
  const s = sc >= 1 ? Math.floor(sc * 4) / 4 : sc;
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  cv.style.top = (isTouch && !portrait ? Math.max(0, (vh - H * s) / 2) : isTouch ? top : Math.max(top, (vh - H * s) / 2)) + 'px';
  touchUI.classList.toggle('overlay', isTouch && !portrait);
  const rot = document.getElementById('rotate');
  rot.hidden = !(isTouch && portrait);
  rot.style.top = (top + H * s + 18) + 'px';
}
addEventListener('resize', layout);
layout();

for (const el of document.querySelectorAll('[data-b]')) {
  const b = el.dataset.b;
  const on = e => { e.preventDefault(); initAudio(); touch[b] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } };
  const off = e => { e.preventDefault(); touch[b] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
document.getElementById('bMute').addEventListener('click', () => { initAudio(); toggleMute(); });
const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
let padId = null;
function padMove(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = r.width / 2 - 20;
  const k = len > max ? max / len : 1;
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  const dead = 16;
  const a = Math.atan2(dy, dx);
  touch.left = touch.right = touch.up = touch.down = false;
  if (len < dead) return;
  const oct = Math.round(a / (Math.PI / 4));
  if (oct === 0) touch.right = true;
  else if (oct === 1) { touch.right = touch.down = true; }
  else if (oct === 2) touch.down = true;
  else if (oct === 3) { touch.left = touch.down = true; }
  else if (oct === 4 || oct === -4) touch.left = true;
  else if (oct === -3) { touch.left = touch.up = true; }
  else if (oct === -2) touch.up = true;
  else if (oct === -1) { touch.right = touch.up = true; }
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); padId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } padMove(e); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
const padUp = e => { if (e.pointerId !== padId) return; padId = null; touch.left = touch.right = touch.up = touch.down = false; knob.style.transform = ''; };
dpad.addEventListener('pointerup', padUp);
dpad.addEventListener('pointercancel', padUp);
// tapping the screen works as START in menus
cv.addEventListener('pointerdown', () => { if (G.scene !== 'fight') { touch.start = true; setTimeout(() => { touch.start = false; }, 80); } });

// ---------------- main loop ----------------
let acc = 0, last = performance.now();
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(200, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { step(); acc -= STEP; n++; }
  render();
  requestAnimationFrame(loop);
}
try { document.fonts.load('8px "Press Start 2P"'); } catch (e) { /* font loads on its own */ }
requestAnimationFrame(loop);
</script>
